name: LifeOps Android CI
on:
  push:
    branches: [ main ]
    paths: [ 'LifeOps/**', '.github/workflows/lifeops-android.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'LifeOps/**' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK preinstalled
        run: sdkmanager --list_installed || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle -p LifeOps assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LifeOps-debug-apk
          path: LifeOps/app/build/outputs/apk/debug/*.apk